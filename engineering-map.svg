<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Drishya's engineering map: problem to AI, APIs, data and reliable systems">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset="0.5" stop-color="#a371f7"/><stop offset="1" stop-color="#39d353"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="20" fill="#0d1117" stroke="#21262d"/>
  <text x="40" y="42" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ENGINEERING MAP</text>
  <text x="40" y="65" fill="#8b949e" font-family="monospace" font-size="12">from a problem worth solving → a system worth understanding</text>

  <g stroke="url(#line)" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.8">
    <path d="M145 140 H300 H455 H610 H765 H920 H1055"/>
  </g>
  <g fill="#0d1117" stroke-width="2">
    <circle cx="145" cy="140" r="44" stroke="#8b949e"/><circle cx="300" cy="140" r="44" stroke="#58a6ff"/>
    <circle cx="455" cy="140" r="44" stroke="#a371f7"/><circle cx="610" cy="140" r="44" stroke="#f778ba"/>
    <circle cx="765" cy="140" r="44" stroke="#f0883e"/><circle cx="920" cy="140" r="44" stroke="#39d353"/><circle cx="1055" cy="140" r="44" stroke="#79c0ff"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="145" y="136" fill="#fff" font-size="13" font-weight="700">PROBLEM</text><text x="145" y="153" fill="#8b949e" font-size="10">requirements</text>
    <text x="300" y="136" fill="#fff" font-size="13" font-weight="700">DATA</text><text x="300" y="153" fill="#8b949e" font-size="10">signals</text>
    <text x="455" y="136" fill="#fff" font-size="13" font-weight="700">AI / ML</text><text x="455" y="153" fill="#8b949e" font-size="10">models</text>
    <text x="610" y="136" fill="#fff" font-size="13" font-weight="700">RETRIEVE</text><text x="610" y="153" fill="#8b949e" font-size="10">embeddings</text>
    <text x="765" y="136" fill="#fff" font-size="13" font-weight="700">API</text><text x="765" y="153" fill="#8b949e" font-size="10">services</text>
    <text x="920" y="136" fill="#fff" font-size="13" font-weight="700">RELIABILITY</text><text x="920" y="153" fill="#8b949e" font-size="10">failure modes</text>
    <text x="1055" y="136" fill="#fff" font-size="13" font-weight="700">IMPACT</text><text x="1055" y="153" fill="#8b949e" font-size="10">measure + iterate</text>
  </g>
  <g font-family="monospace" font-size="11" fill="#484f58">
    <text x="145" y="213" text-anchor="middle">01</text><text x="300" y="213" text-anchor="middle">02</text><text x="455" y="213" text-anchor="middle">03</text><text x="610" y="213" text-anchor="middle">04</text><text x="765" y="213" text-anchor="middle">05</text><text x="920" y="213" text-anchor="middle">06</text><text x="1055" y="213" text-anchor="middle">07</text>
  </g>
</svg>